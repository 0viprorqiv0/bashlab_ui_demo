<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403: Access Denied</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      height: 100%;
      width: 100%;
      background-color: #000000;
      color: #E8E9F0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .error-container {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      padding: 24px;
    }
    .error-content {
      display: inline-flex;
      align-items: center;
      text-align: left;
    }
    .error-code {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 500;
      line-height: 48px;
      padding-right: 24px;
      color: #E8E9F0;
      letter-spacing: -0.02em;
    }
    .divider {
      width: 1px;
      height: 48px;
      background-color: rgba(255, 255, 255, 0.25);
    }
    .error-message {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 400;
      line-height: 48px;
      padding-left: 24px;
      color: #E8E9F0;
      letter-spacing: 0;
      white-space: nowrap;
    }
    @media (max-width: 640px) {
      .error-content {
        flex-direction: row;
      }
      .error-code {
        font-size: 22px;
        padding-right: 18px;
      }
      .error-message {
        font-size: 14px;
        padding-left: 18px;
        white-space: normal;
        line-height: 1.4;
      }
      .divider {
        height: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-content">
      <h1 class="error-code">403</h1>
      <div class="divider" aria-hidden="true"></div>
      <p class="error-message">You do not have permission to access this page.</p>
    </div>
  </div>
</body>
</html>
